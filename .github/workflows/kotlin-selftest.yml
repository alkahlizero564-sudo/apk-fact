name: kotlin-selftest
on:
  push:
    branches: [claude/build-errors-f865fj]
    paths:
      - "scripts/templates/kotlin/**"
      - "scripts/kotlin_project.py"
      - "scripts/check_kotlin.py"
      - "scripts/templates/update_check.kt"
      - ".github/workflows/kotlin-selftest.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check of the sample
        run: |
          mkdir -p "$RUNNER_TEMP/sample" && cp scripts/templates/kotlin/sample/MainActivity.kt "$RUNNER_TEMP/sample/"
          cd scripts && python check_kotlin.py "$RUNNER_TEMP/sample" "$RUNNER_TEMP/proj" --rounds 0 --app kotlin-sample --version 3
      - name: Inject updater and assemble release
        run: |
          python scripts/updater.py inject kotlin "$RUNNER_TEMP/proj" kotlin-sample 3
          gradle -p "$RUNNER_TEMP/proj" :app:assembleRelease --console=plain
          ls -la "$RUNNER_TEMP/proj/app/build/outputs/apk/release/"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$RUNNER_TEMP/proj/app/build/outputs/apk/release/app-release.apk" | head -5 || true
      - name: A broken file gives Kotlin errors the fixer can read
        run: |
          mkdir -p "$RUNNER_TEMP/bad" && sed 's/Icons.Filled.Home/Icons.Filled.NoSuchIcon/' scripts/templates/kotlin/sample/MainActivity.kt > "$RUNNER_TEMP/bad/MainActivity.kt"
          cd scripts && (python check_kotlin.py "$RUNNER_TEMP/bad" "$RUNNER_TEMP/proj2" --rounds 0 --app bad && exit 1 || true)
          python -c "import fix_memory; print('lines:', fix_memory.error_lines(open('/dev/stdin').read()))" <<< "e: file:///x/app/src/main/java/app/main/MainActivity.kt:55:72 Unresolved reference 'NoSuchIcon'."
