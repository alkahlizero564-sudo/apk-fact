name: build-flutter
run-name: Build ${{ inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name under apps/"
        required: true
      notes:
        description: "What changed (shown in the installed app's update message)"
        required: false
        default: ""
      store:
        description: "true: also build the Google Play file (.aab), signed with the app's permanent key"
        required: false
        default: "false"

permissions:
  contents: write

# The public updates repo (APK Fact > الإعدادات > الخصوصية): APKs and version.json for installed apps.
env:
  UPDATES_REPO: ${{ vars.UPDATES_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Biggest speed-up: reuse Gradle (Android deps + plugin) and pub (Dart packages) between builds instead of
      # re-downloading them every time. Each run restores the latest cache and saves an updated one.
      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: flutter-build-${{ github.run_id }}
          restore-keys: |
            flutter-build-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow (turns the app icon into real PNGs)
        run: pip install pillow

      - name: Pick the version number
        env:
          APP: ${{ inputs.app }}
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          V=$(python scripts/updater.py next "$APP")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "This build is version $V (1.0.$V)"

      - name: Build APK (AI fixes errors and retries)
        env:
          APP: ${{ inputs.app }}
          MAX_ATTEMPTS: "4"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          # The owner's Claude key (APK Fact > الإعدادات): used first, Gemini when it fails or runs out.
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          SRC="$GITHUB_WORKSPACE/apps/$APP"
          PROJ="$RUNNER_TEMP/flutter_app"
          NAME="app_$(echo "$APP" | tr '-' '_')"
          flutter create --platforms=android --org com.generated --project-name "$NAME" "$PROJ"
          rm -rf "$PROJ/test"
          # Speed: warm build cache + parallel modules + more heap (less GC pauses) + configure only the modules
          # a task needs + no file-watching on a one-shot runner.
          printf '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.configureondemand=true\norg.gradle.vfs.watch=false\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC\n' >> "$PROJ/android/gradle.properties"
          # The name under the icon (can be Arabic), from apps/<app>/display-name.txt.
          python scripts/app_label.py android "$PROJ/android/app/src/main/res" "$APP"
          python scripts/app_label.py manifest "$PROJ/android/app/src/main/AndroidManifest.xml"
          # The app icon (apps/<app>/icon.png) in every Android size; flutter create only has Flutter's own.
          python scripts/app_icon.py android "$PROJ/android/app/src/main/res" "$APP"
          # Package name (apps/<app>/package.txt or the default) and Android SDK 36 for Google Play.
          python scripts/app_id.py gradle "$(ls "$PROJ"/android/app/build.gradle* | head -1)" "$APP" flutter
          # Skip Android's release lint (lintVitalAnalyzeRelease): a generated app doesn't need it, it costs minutes, and
          # it crashed the build of tarag4 three times (LintDriver NoSuchMethodError). `prop = value` works in both
          # build.gradle (Groovy) and build.gradle.kts (Kotlin).
          GRADLE_FILE="$(ls "$PROJ"/android/app/build.gradle* | head -1)"
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$GRADLE_FILE"
          grep -n -A3 "^android {" "$GRADLE_FILE" | head -5
          # Android permissions (INTERNET too: release builds don't have it by default).
          python scripts/perms.py manifest "$APP" "$PROJ/android/app/src/main/AndroidManifest.xml"

          # Apps of a connected pair: every piece of the connection in the code before building (scripts/pair_wiring.py).
          if [ -f "$SRC/pair.json" ] && grep -q "import 'backend.dart'" "$SRC/lib/main.dart"; then python scripts/flutter_backend.py "$APP"; fi
          if [ -f "$SRC/pair.json" ]; then PAIR_FIX_QUICK=1 GEMINI_STALL_SECONDS=120 python "$GITHUB_WORKSPACE/scripts/pair_wiring.py" fix "$APP" || true; fi
          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            # Copy the (possibly fixed) code and packages in, apply dart fix, analyze, AI-fix errors.
            python scripts/check_flutter.py "$SRC" "$PROJ" --rounds 1 || echo "Check not clean, building anyway"
            python scripts/updater.py inject flutter "$PROJ" "$APP" "$VERSION"
            set +e
            (cd "$PROJ" && flutter build apk --release --build-number "$VERSION" --build-name "1.0.$VERSION") 2>&1 | tee "$RUNNER_TEMP/build.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to fix main.dart ==="
            python scripts/fix_native.py flutter "$SRC/lib/main.dart" "$RUNNER_TEMP/build.log" || echo "AI fix failed, retrying"
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp "$PROJ/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/$APP.apk"

          if [ "${{ inputs.store }}" = "true" ]; then
            echo "=== Google Play file (.aab) ==="
            (cd "$PROJ" && flutter build appbundle --release --build-number "$VERSION" --build-name "1.0.$VERSION")
            cp "$PROJ/build/app/outputs/bundle/release/app-release.aab" "$GITHUB_WORKSPACE/$APP.aab"
          fi

      - name: Save fixed code
        env:
          APP: ${{ inputs.app }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP" fixes
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          # GitHub sometimes answers a push with a temporary error (500): retry instead of losing the fixed code.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Sign with the app's permanent key (private vault)
        env:
          APP: ${{ inputs.app }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
        run: |
          # The Google Play file (.aab) is signed with the same permanent key; it needs the vault.
          AAB=(); if [ -f "$APP.aab" ]; then AAB=(--aab "$APP.aab"); fi
          python scripts/vault.py --app "$APP" --apk "$APP.apk" "${AAB[@]}" --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          python scripts/updates_repo.py release "app-$APP-${{ github.run_id }}" "$APP (Flutter) #${{ github.run_number }}" "APK for $APP (Flutter)" "$APP.apk" $( [ -f "$APP.aab" ] && echo "$APP.aab" )

      - name: Tell installed copies an update is ready
        env:
          APP: ${{ inputs.app }}
          TAG: app-${{ inputs.app }}-${{ github.run_id }}
          UPDATE_NOTES: ${{ inputs.notes }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          if [ -z "$VAULT_TOKEN" ] || [ -z "$VAULT_REPO" ]; then
            echo "::warning::No private vault: this APK is not signed with a permanent key, so it cannot update installed copies. Set up the vault in APK Fact > الإعدادات."
            exit 0
          fi
          python scripts/updater.py publish "$APP" "$VERSION" "$(python scripts/updates_repo.py base "$TAG")/$APP.apk"
          git add "apps/$APP/version.json"
          if git commit -m "Version $VERSION: $APP"; then
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              [ "$i" -eq 5 ] && exit 1
              sleep $((i * 5))
            done
          fi
          # Installed copies read version.json from the public updates repo when apk-fact is private.
          python scripts/updates_repo.py mirror "$APP"
