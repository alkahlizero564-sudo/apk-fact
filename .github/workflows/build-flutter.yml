name: build-flutter

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name under apps/"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build APK (AI fixes errors and retries)
        env:
          APP: ${{ inputs.app }}
          MAX_ATTEMPTS: "4"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          PROJ="$RUNNER_TEMP/flutter_app"
          NAME="app_$(echo "$APP" | tr '-' '_')"
          flutter create --platforms=android --project-name "$NAME" "$PROJ"
          rm -rf "$PROJ/test"
          cp "apps/$APP/lib/main.dart" "$PROJ/lib/main.dart"

          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            set +e
            (cd "$PROJ" && flutter build apk --release) 2>&1 | tee "$RUNNER_TEMP/build.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to fix main.dart ==="
            python scripts/fix_flutter.py "$PROJ/lib/main.dart" "$RUNNER_TEMP/build.log"
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp "$PROJ/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/$APP.apk"
          cp "$PROJ/lib/main.dart" "apps/$APP/lib/main.dart"

      - name: Save fixed code
        env:
          APP: ${{ inputs.app }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP/lib/main.dart"
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          git pull --rebase
          git push

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ inputs.app }}
          name: ${{ inputs.app }}
          files: ${{ inputs.app }}.apk
          make_latest: false
