<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DMC Admin - تطبيق الإدارة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
    :root {
      --primary-dark: #0A2F6B;
      --primary-blue: #0A47A8;
      --accent-cyan: #00B8C4;
      --bg-page: #F3F7FC;
      --card-bg: #FFFFFF;
      --card-border: #E1E9F3;
      --status-green: #00A86B;
      --status-red: #E53935;
      --r-md: 16px;
      --r-full: 9999px;
      --font-family: 'Cairo', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
    body { background-color: #0d131d; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .phone-wrapper { margin-top: 20px; width: 100%; max-width: 412px; height: 840px; background: var(--bg-page); border-radius: 36px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); position: relative; overflow: hidden; display: flex; flex-direction: column; }
    .admin-header { background: var(--primary-dark); color: #FFF; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .app-viewport { flex: 1; position: relative; overflow-y: auto; padding-bottom: 70px; }
    .view-screen { display: none; }
    .view-screen.active { display: block; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 68px; background: #FFF; border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { background: none; border: none; color: #64748B; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item.active { color: var(--primary-blue); }
    .dmc-card { background: var(--card-bg); border-radius: var(--r-md); border: 1px solid var(--card-border); padding: 14px; margin: 12px; }
    .btn-primary { background: var(--primary-blue); color: #FFF; height: 46px; border-radius: var(--r-md); border: none; font-size: 14px; font-weight: 800; width: 100%; cursor: pointer; }
    .form-input { width: 100%; height: 46px; border: 1px solid var(--card-border); border-radius: var(--r-md); padding: 0 14px; font-size: 13px; outline: none; }
  </style>
</head>
<body>
  <div class="phone-wrapper">
    <div class="admin-header">
      <div style="font-weight:900;">DMC تطبيق الإدارة والتحكم</div>
      <div>
        <span onclick="switchTab(3)" style="cursor:pointer; margin-left:10px;">📢</span>
        <span onclick="switchTab(4)" style="cursor:pointer;">⚙️</span>
      </div>
    </div>
    <div class="app-viewport">
      <!-- 1. Dashboard -->
      <div id="tab-0" class="view-screen active">
        <div class="dmc-card">
          <h3>سعر الدولار اليوم</h3>
          <input type="number" class="form-input" value="1100" style="margin:10px 0;">
          <button class="btn-primary" onclick="alert('تم التحديث')">تحديث الأسعار</button>
        </div>
      </div>
      <!-- 2. Orders -->
      <div id="tab-1" class="view-screen">
        <div class="dmc-card"><h3>إدارة الطلبات</h3><p>طلب #8821 - د. محمد أحمد</p></div>
      </div>
      <!-- 3. Products -->
      <div id="tab-2" class="view-screen">
        <div class="dmc-card"><h3>المنتجات والمخزون</h3><p>محلول جلوكوز 5%</p></div>
      </div>
      <!-- 4. Purchases -->
      <div id="tab-3" class="view-screen">
        <div class="dmc-card"><h3>المشتريات</h3><p>فاتورة مورد الخرطوم</p></div>
      </div>
      <!-- 5. Customers -->
      <div id="tab-4" class="view-screen">
        <div class="dmc-card"><h3>سجل الزبائن</h3><p>د. محمد أحمد - موثق</p></div>
      </div>
    </div>
    <div class="bottom-nav">
      <button class="nav-item active" onclick="switchTab(0)">🏠 الرئيسية</button>
      <button class="nav-item" onclick="switchTab(1)">🛍️ الطلبات</button>
      <button class="nav-item" onclick="switchTab(2)">📦 المنتجات</button>
      <button class="nav-item" onclick="switchTab(3)">🧾 المشتريات</button>
      <button class="nav-item" onclick="switchTab(4)">👥 الزبائن</button>
    </div>
  </div>
  <script>
    function switchTab(index) {
      document.querySelectorAll('.view-screen').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.nav-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
    }
  </script>
</body>
</html>
