name: build-flutter

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name under apps/"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build APK (AI fixes errors and retries)
        env:
          APP: ${{ inputs.app }}
          MAX_ATTEMPTS: "4"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          SRC="$GITHUB_WORKSPACE/apps/$APP"
          PROJ="$RUNNER_TEMP/flutter_app"
          NAME="app_$(echo "$APP" | tr '-' '_')"
          flutter create --platforms=android --org com.generated --project-name "$NAME" "$PROJ"
          rm -rf "$PROJ/test"

          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            # Copy the (possibly fixed) code and packages in, apply dart fix, analyze, AI-fix errors.
            python scripts/check_flutter.py "$SRC" "$PROJ" --rounds 1 || echo "Check not clean, building anyway"
            set +e
            (cd "$PROJ" && flutter build apk --release) 2>&1 | tee "$RUNNER_TEMP/build.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to fix main.dart ==="
            python scripts/fix_native.py flutter "$SRC/lib/main.dart" "$RUNNER_TEMP/build.log" || echo "AI fix failed, retrying"
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp "$PROJ/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/$APP.apk"

      - name: Save fixed code
        env:
          APP: ${{ inputs.app }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP"
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          git pull --rebase
          git push

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
        run: |
          gh release create "app-$APP-${{ github.run_id }}" "$APP.apk" \
            --title "$APP (Flutter) #${{ github.run_number }}" \
            --notes "APK for $APP (Flutter)"
