name: Build App APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name inside apps/"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: ${{ github.event.inputs.app }}
      MAX_ATTEMPTS: "3"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wrap HTML as Android app and build (AI fixes errors and retries)
        run: |
          set -e
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          test -f "apps/$APP/index.html"
          PKG=$(echo "$APP" | tr -cd 'a-z0-9')
          SRC="$GITHUB_WORKSPACE/apps/$APP"

          # JavaScript errors don't fail the APK build but leave the app broken: fix them first.
          for k in 1 2; do
            if node "$GITHUB_WORKSPACE/scripts/check_html.js" "$SRC/index.html" > /tmp/check.log; then
              cat /tmp/check.log
              break
            fi
            cat /tmp/check.log
            echo "=== JavaScript errors found. Asking AI to fix index.html ==="
            python "$GITHUB_WORKSPACE/scripts/fix_html.py" "$SRC/index.html" /tmp/check.log || echo "AI fix failed, continuing"
          done

          mkdir /tmp/wrap
          cd /tmp/wrap
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          mkdir www
          cp -r "$SRC"/. www/
          rm -f www/icon.png
          npx cap init "$APP" "com.generated.a$PKG" --web-dir www
          npx cap add android

          if [ -f "$SRC/icon.png" ]; then
            echo "Custom icon found, applying it"
            mkdir -p assets
            node -e "require('sharp')(process.argv[1]).resize(1024,1024,{fit:'cover'}).png().toFile('assets/icon.png').then(()=>console.log('icon ready')).catch(e=>{console.error(e);process.exit(1)})" "$SRC/icon.png" || echo "icon resize failed, using default icon"
            if [ -f assets/icon.png ]; then
              npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' || echo "icon generate failed, using default icon"
            fi
          else
            echo "No custom icon, using default"
          fi

          chmod +x android/gradlew

          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            rm -rf www
            mkdir www
            cp -r "$SRC"/. www/
            rm -f www/icon.png
            set +e
            (npx cap sync android && cd android && ./gradlew assembleDebug --no-daemon) 2>&1 | tee /tmp/build.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to check index.html ==="
            set +e
            python "$GITHUB_WORKSPACE/scripts/fix_html.py" "$SRC/index.html" /tmp/build.log
            FIX=$?
            set -e
            if [ "$FIX" -eq 3 ]; then
              echo "Not caused by index.html, retrying once more without changes"
            elif [ "$FIX" -ne 0 ]; then
              echo "AI could not fix this build (code $FIX)"
              break
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APP.apk"

      - name: Save fixed code
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP/index.html"
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          git pull --rebase
          git push

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-$APP-${{ github.run_number }}" "$APP.apk" \
            --title "$APP #${{ github.run_number }}" \
            --notes "APK for $APP"
