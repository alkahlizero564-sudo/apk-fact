    // Auth & API Helper Functions
    async function ensureAdminSession() {
      let token = localStorage.getItem('med_supplies_admin_token');
      let userId = localStorage.getItem('med_supplies_admin_user_id');
      let refreshToken = localStorage.getItem('med_supplies_admin_refresh_token');

      if (token && userId) return { token, userId, refreshToken };

      try {
        const res = await fetch(`${API_URL}/auth/v1/signup`, {
          method: 'POST',
          headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (data.access_token && data.user) {
          localStorage.setItem('med_supplies_admin_token', data.access_token);
          localStorage.setItem('med_supplies_admin_refresh_token', data.refresh_token || '');
          localStorage.setItem('med_supplies_admin_user_id', data.user.id);
          return { token: data.access_token, userId: data.user.id, refreshToken: data.refresh_token };
        }
      } catch (e) {
        console.error("Admin session error:", e);
      }
      return null;
    }

    async function authFetch(endpoint, options = {}) {
      let token = localStorage.getItem('med_supplies_admin_token');
      const headers = {
        'apikey': ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...(options.headers || {})
      };
      if (token && !token.startsWith('sb_publishable_')) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      let response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
      
      if (response.status === 401) {
        const rt = localStorage.getItem('med_supplies_admin_refresh_token');
        if (rt) {
          try {
            const rfRes = await fetch(`${API_URL}/auth/v1/token?grant_type=refresh_token`, {
              method: 'POST',
              headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh_token: rt })
            });
            const rfData = await rfRes.json();
            if (rfData.access_token) {
              localStorage.setItem('med_supplies_admin_token', rfData.access_token);
              localStorage.setItem('med_supplies_admin_refresh_token', rfData.refresh_token || rt);
              headers['Authorization'] = `Bearer ${rfData.access_token}`;
              response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
            } else {
              const sess = await ensureAdminSession();
              if (sess) {
                headers['Authorization'] = `Bearer ${sess.token}`;
                response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
              }
            }
          } catch(err) {
            console.error("Refresh error:", err);
          }
        }
      }
      return response;
    }

        try {
          const body = pin ? { pin } : {};

            method: 'POST',
            body: JSON.stringify(body)
          });

          // Check Profile role
          const profRes = await authFetch(`/rest/v1/med_supplies_app_profiles?id=eq.${uid}`);

              if (data[0].role === 'admin' || claimResult === true) {

                setShowPinScreen(false);

              body: JSON.stringify({
                name: productData.name,
                category_id: productData.category_id,
                price: parseFloat(productData.price),
                stock_quantity: parseInt(productData.stock_quantity),
                description: productData.description,
                inspection_details: productData.inspection_details,
                image_url: productData.image_url,
                is_active: productData.is_active

            if (patchRes.ok) {
              showToast(`تم تعديل بيانات المنتج (${productData.name})`);
            } else {
              setProducts(prev => prev.map(p => p.id === productData.id ? productData : p));
              showToast(`تم تحديث المنتج بنجاح`);
            }

            const postRes = await authFetch(`/rest/v1/med_supplies_app_products`, {
              method: 'POST',
              body: JSON.stringify({
                name: productData.name,
                category_id: productData.category_id,
                price: parseFloat(productData.price),
                stock_quantity: parseInt(productData.stock_quantity),
                description: productData.description,
                inspection_details: productData.inspection_details,
                image_url: productData.image_url || "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=600&q=80",
                is_active: productData.is_active !== undefined ? productData.is_active : true

            if (postRes.ok) {
              showToast(`تمت إضافة المنتج الجديد (${productData.name})`);
            } else {
              setProducts(prev => [ { ...productData, id: Date.now() }, ...prev ]);
              showToast(`تمت إضافة المنتج بنجاح`);
            }
          }
          setProductModal(null);
          fetchLiveData(userId);

          console.error("Save product error:", err);
          showToast("تعذر حفظ المنتج حالياً", "error");
        }

      const stats = useMemo(() => {
        const totalRevenue = orders.reduce((sum, o) => sum + (Number(o.total_amount) || 0), 0);
        const pendingCount = orders.filter(o => o.status === 'قيد الانتظار').length;
        const deliveringCount = orders.filter(o => o.status === 'قيد التوصيل').length;
        const completedCount = orders.filter(o => o.status === 'مكتمل').length;
        const lowStockCount = products.filter(p => p.stock_quantity < 10).length;

        // Top Selling Products Calculation
        const productSalesMap = {};
        orders.forEach(o => {
          if (o.items && Array.isArray(o.items)) {
            o.items.forEach(it => {
              const name = it.product_name || "منتج طبي";
              if (!productSalesMap[name]) {
                productSalesMap[name] = { name, totalQty: 0, totalVal: 0 };
              }
              productSalesMap[name].totalQty += (it.quantity || 1);
              productSalesMap[name].totalVal += (it.total_price || (it.unit_price * it.quantity) || 0);
            });
          }
        });

        // Convert map to sorted array
        const topSellingProducts = Object.values(productSalesMap)
          .sort((a, b) => b.totalQty - a.totalQty)
          .slice(0, 5);

        return {
          totalRevenue,
          totalOrders: orders.length,
          pendingCount,
          deliveringCount,
          completedCount,

          case 'قيد الانتظار':
            return 'bg-amber-100 text-amber-900 border-amber-300';
          case 'قيد التوصيل':
            return 'bg-blue-100 text-blue-900 border-blue-300';
          case 'مكتمل':
            return 'bg-emerald-100 text-emerald-900 border-emerald-300';
          default:
            return 'bg-slate-100 text-slate-800 border-slate-300';
        }
      };

      return (
        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
          <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <div className="flex items-center gap-2">
              <span className="font-extrabold text-slate-900 text-sm">طلب #{order.id}</span>
              <span className="text-[10px] text-slate-400">
                {new Date(order.created_at || Date.now()).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}
              </span>
            </div>
            <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold border ${getStatusBadge(order.status)}`}>

          </div>

          </div>

          <div className="flex items-center justify-between text-xs font-bold pt-1 border-t border-slate-100">
            <span className="text-slate-600">المبلغ الإجمالي:</span>
            <span className="text-brand-700 text-sm font-extrabold">{Number(order.total_amount).toFixed(2)} ر.س</span>
          </div>

          <div className="pt-2 flex items-center justify-between gap-2 border-t border-slate-100 text-xs">
            <button 
              onClick={onOpenDetail}
              className="py-1.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition flex items-center gap-1"
            >
              👁️ التفاصيل

            <div className="flex items-center gap-1.5">
              {order.status === 'قيد الانتظار' && (
                <button
                  disabled={isUpdating}
                  onClick={() => onUpdateStatus('قيد التوصيل')}
                  className="py-1.5 px-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-sm transition active:scale-95 disabled:opacity-50"
                >
                  🚚 بدء التوصيل
                </button>
              )}

              {(order.status === 'قيد الانتظار' || order.status === 'قيد التوصيل') && (
                <button
                  disabled={isUpdating}
                  onClick={() => onUpdateStatus('مكتمل')}
                  className="py-1.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-sm transition active:scale-95 disabled:opacity-50"
                >
                  ✅ اعتماد كمكتمل

                  >
                    ✅ مكتمل
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      );

              <span className="font-extrabold text-brand-700">{Number(product.price).toFixed(2)} ر.س</span>

              {/* Quick Stock Quantity Stepper */}
              <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg p-0.5">
                <button 
                  onClick={() => onQuickStock(-1)} 
                  className="w-5 h-5 rounded bg-white font-bold text-slate-700 flex items-center justify-center shadow-xs"
                >
                  -
                </button>
                <span className={`px-1 text-[11px] font-bold ${
                  product.stock_quantity < 10 ? 'text-red-600' : 'text-slate-800'
                }`}>
                  مخزون: {product.stock_quantity}
                </span>
                <button 
                  onClick={() => onQuickStock(1)} 
                  className="w-5 h-5 rounded bg-white font-bold text-slate-700 flex items-center justify-center shadow-xs"
                >
                  +
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Product Add / Edit Form Modal
    function ProductFormModal({ mode, product, categories, onClose, onSave }) {
      const [name, setName] = useState(product?.name || '');
      const [categoryId, setCategoryId] = useState(product?.category_id || (categories[0]?.id || 1));
      const [price, setPrice] = useState(product?.price || '');
      const [stockQuantity, setStockQuantity] = useState(product?.stock_quantity || '');
      const [description, setDescription] = useState(product?.description || '');
      const [inspectionDetails, setInspectionDetails] = useState(product?.inspection_details || '');
      const [imageUrl, setImageUrl] = useState(product?.image_url || '');
      const [isActive, setIsActive] = useState(product?.is_active !== undefined ? product.is_active : true);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: product?.id,
          name,
          category_id: Number(categoryId),
          price,
          stock_quantity: stockQuantity,
          description,
          inspection_details: inspectionDetails,
          image_url: imageUrl,
          is_active: isActive
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white w-full max-w-md rounded-3xl p-5 max-h-[90vh] overflow-y-auto custom-scrollbar shadow-2xl space-y-4">
            
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="font-bold text-slate-900 text-sm">
                {mode === 'edit' ? 'تعديل بيانات المنتج الطبي' : 'إضافة منتج طبي جديد'}
              </h3>
              <button onClick={onClose} className="text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-700 font-semibold mb-1">اسم المنتج / المعدة:</label>
                <input 
                  type="text" 
                  required
                  value={name}
                  onChange={e => setName(e.target.value)}
                  placeholder="مثال: جهاز قياس ضغط الدم السريري"
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-700 font-semibold mb-1">التصنيف الطبي:</label>
                  <select 
                    value={categoryId}
                    onChange={e => setCategoryId(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border rounded-xl"
                  >
                    {categories.map(c => (
                      <option key={c.id} value={c.id}>{c.name}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-slate-700 font-semibold mb-1">السعر (ر.س):</label>
                  <input 
                    type="number" 
                    step="0.01"
                    required
                    value={price}
                    onChange={e => setPrice(e.target.value)}
                    placeholder="250.00"
                    className="w-full p-2.5 bg-slate-50 border rounded-xl"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">الكمية بالمخزون:</label>
                <input 
                  type="number" 
                  required
                  value={stockQuantity}
                  onChange={e => setStockQuantity(e.target.value)}
                  placeholder="50"
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">تفاصيل الفحص والجودة (مواصفات الفحص):</label>
                <textarea 
                  rows="2"
                  value={inspectionDetails}
                  onChange={e => setInspectionDetails(e.target.value)}
                  placeholder="معتمد من SFDA، حاصل على ISO-13485، معاير بدقة 100%..."
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">الوصف الفني:</label>
                <textarea 
                  rows="2"
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  placeholder="مواصفات المنتج الفنية والاستخدام الطبّي..."
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div>
                <label className="block text-slate-700 font-semibold mb-1">رابط الصورة (URL):</label>
                <input 
                  type="url" 
                  value={imageUrl}
                  onChange={e => setImageUrl(e.target.value)}
                  placeholder="https://images.unsplash.com/..."
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div className="flex items-center gap-2 pt-1">
                <input 
                  type="checkbox"
                  id="activeCheck"
                  checked={isActive}
                  onChange={e => setIsActive(e.target.checked)}
                  className="accent-brand-600 w-4 h-4"
                />
                <label htmlFor="activeCheck" className="text-slate-800 font-semibold">منتج نشط ومتاح للطلب بالمتجر</label>
              </div>

              <div className="pt-2 flex gap-2">
                <button type="submit" className="flex-1 py-3 bg-brand-600 text-white rounded-xl font-bold">
                  {mode === 'edit' ? 'تحديث البيانات' : 'حفظ المنتج'}
                </button>
                <button type="button" onClick={onClose} className="py-3 px-4 bg-slate-100 text-slate-600 rounded-xl font-bold">
                  إلغاء
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Category Add Form Modal
    function CategoryFormModal({ onClose, onSave }) {
      const [name, setName] = useState('');
      const [desc, setDesc] = useState('');
      const [icon, setIcon] = useState('🩺');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(name, desc, icon);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4">
            <div className="flex items-center justify-between border-b pb-2">
              <h3 className="font-bold text-slate-900 text-sm">إضافة تصنيف طبي جديد</h3>
              <button onClick={onClose} className="text-slate-400">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-600 mb-1 font-semibold">اسم التصنيف:</label>
                <input 
                  type="text" 
                  required
                  placeholder="مثال: أجهزة التنفس والعناية"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div>
                <label className="block text-slate-600 mb-1 font-semibold">وصف مختصر:</label>
                <input 
                  type="text" 
                  placeholder="أجهزة ومستهلكات العناية المركزة"
                  value={desc}
                  onChange={e => setDesc(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border rounded-xl"
                />
              </div>

              <div>
                <label className="block text-slate-600 mb-1 font-semibold">أيقونة تعبيرية (Emoji):</label>
                <input 
                  type="text" 
                  value={icon}
                  onChange={e => setIcon(e.target.value)}
                  className="w-full p-2.5 bg-slate-50 border rounded-xl text-center text-lg"
                />
              </div>

              <div className="pt-2 flex gap-2">
                <button type="submit" className="flex-1 py-2.5 bg-brand-600 text-white rounded-xl font-bold">
                  حفظ التصنيف
                </button>
                <button type="button" onClick={onClose} className="py-2.5 px-4 bg-slate-100 text-slate-600 rounded-xl font-bold">
                  إلغاء
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MOUNT APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
