name: build-python
run-name: Build ${{ inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name under apps/"
        required: true
      notes:
        description: "What changed (shown in the installed app's update message)"
        required: false
        default: ""
      store:
        description: "true: also build the Google Play file (.aab), signed with the app's permanent key"
        required: false
        default: "false"

permissions:
  contents: write

# The public updates repo (APK Fact > الإعدادات > الخصوصية): APKs and version.json for installed apps.
env:
  UPDATES_REPO: ${{ vars.UPDATES_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the version number
        env:
          APP: ${{ inputs.app }}
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          V=$(python scripts/updater.py next "$APP")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "This build is version $V (1.0.$V)"

      - name: Install Flet
        run: |
          V=$(cd scripts && python -c 'from native_langs import FLET_VERSION; print(FLET_VERSION)')
          pip install "flet==$V" "flet-cli==$V"

      - name: Build APK with Flet (AI fixes errors and retries)
        env:
          APP: ${{ inputs.app }}
          MAX_ATTEMPTS: "3"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FLET_CLI_NO_RICH_OUTPUT: "1"
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          SRC="$GITHUB_WORKSPACE/apps/$APP"
          PROJ="$RUNNER_TEMP/py_app"
          NAME="app_$(echo "$APP" | tr '-' '_')"
          test -f "$SRC/main.py"
          LABEL=$(python scripts/app_label.py get "$APP")
          echo "App name on the phone: $LABEL"
          APP_ID=$(python scripts/app_id.py get "$APP" python)
          echo "Package name: $APP_ID"
          PERMS=$(python scripts/perms.py flet "$APP")
          echo "Android permissions: $PERMS"

          # Apps of a connected pair: every piece of the connection in the code before building (scripts/pair_wiring.py).
          if [ -f "$SRC/pair.json" ]; then python "$GITHUB_WORKSPACE/scripts/pair_wiring.py" fix "$APP" || true; fi
          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            # Apply sure Flet 1.x API fixes to the repo copy (saved with the other fixes).
            python scripts/check_python.py --fix "$SRC/main.py" || true
            rm -rf "$PROJ" && mkdir -p "$PROJ/assets"
            cp "$SRC/main.py" "$PROJ/main.py"
            if [ -f "$SRC/requirements.txt" ]; then cp "$SRC/requirements.txt" "$PROJ/"; else echo "flet" > "$PROJ/requirements.txt"; fi
            if [ -d "$SRC/assets" ]; then cp -r "$SRC/assets/." "$PROJ/assets/"; fi
            if [ -f "$SRC/icon.png" ]; then cp "$SRC/icon.png" "$PROJ/assets/icon.png"; fi
            python scripts/updater.py inject python "$PROJ" "$APP" "$VERSION"
            set +e
            (
              python scripts/check_python.py "$PROJ/main.py" &&
              cd "$PROJ" &&
              flet build apk --yes --skip-flutter-doctor --project "$NAME" --product "$LABEL" \
                --org com.generated --bundle-id "$APP_ID" --build-number "$VERSION" --build-version "1.0.$VERSION" \
                -o "$PROJ/out" --android-permissions $PERMS
            ) 2>&1 | tee "$RUNNER_TEMP/build.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ] && ls "$PROJ"/out/*.apk > /dev/null 2>&1; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to fix main.py ==="
            python scripts/fix_native.py python "$SRC/main.py" "$RUNNER_TEMP/build.log" || echo "AI fix failed, retrying"
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp "$(ls "$PROJ"/out/*.apk | head -1)" "$GITHUB_WORKSPACE/$APP.apk"

          if [ "${{ inputs.store }}" = "true" ]; then
            echo "=== Google Play file (.aab) ==="
            (cd "$PROJ" && flet build aab --yes --skip-flutter-doctor --project "$NAME" --product "$LABEL" \
              --org com.generated --bundle-id "$APP_ID" --build-number "$VERSION" --build-version "1.0.$VERSION" \
              -o "$PROJ/out_aab" --android-permissions $PERMS)
            cp "$(ls "$PROJ"/out_aab/*.aab | head -1)" "$GITHUB_WORKSPACE/$APP.aab"
          fi

      - name: Save fixed code
        env:
          APP: ${{ inputs.app }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP" fixes
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          # GitHub sometimes answers a push with a temporary error (500): retry instead of losing the fixed code.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Sign with the app's permanent key (private vault)
        env:
          APP: ${{ inputs.app }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
        run: |
          # The Google Play file (.aab) is signed with the same permanent key; it needs the vault.
          AAB=(); if [ -f "$APP.aab" ]; then AAB=(--aab "$APP.aab"); fi
          python scripts/vault.py --app "$APP" --apk "$APP.apk" "${AAB[@]}" --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
          APP: ${{ inputs.app }}
        run: |
          python scripts/updates_repo.py release "app-$APP-${{ github.run_id }}" "$APP (Python) #${{ github.run_number }}" "APK for $APP (Python / Flet)" "$APP.apk" $( [ -f "$APP.aab" ] && echo "$APP.aab" )

      - name: Tell installed copies an update is ready
        env:
          APP: ${{ inputs.app }}
          TAG: app-${{ inputs.app }}-${{ github.run_id }}
          UPDATE_NOTES: ${{ inputs.notes }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          if [ -z "$VAULT_TOKEN" ] || [ -z "$VAULT_REPO" ]; then
            echo "::warning::No private vault: this APK is not signed with a permanent key, so it cannot update installed copies. Set up the vault in APK Fact > الإعدادات."
            exit 0
          fi
          python scripts/updater.py publish "$APP" "$VERSION" "$(python scripts/updates_repo.py base "$TAG")/$APP.apk"
          git add "apps/$APP/version.json"
          if git commit -m "Version $VERSION: $APP"; then
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              [ "$i" -eq 5 ] && exit 1
              sleep $((i * 5))
            done
          fi
          # Installed copies read version.json from the public updates repo when apk-fact is private.
          python scripts/updates_repo.py mirror "$APP"
