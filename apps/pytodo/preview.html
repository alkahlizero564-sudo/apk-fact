<<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>PyTodo Preview</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phone { width: 380px; height: 750px; background: #fff; border-radius: 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 8px solid #111; }
        .header { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .header h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; }
        .content { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
        .stats { background: linear-gradient(135deg, #e0f2f1, #b2dfdb); padding: 16px; border-radius: 16px; display: flex; justify-content: space-around; text-align: center; }
        .stat-val { font-weight: bold; font-size: 18px; color: #00796b; }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 12px; outline: none; }
        select { padding: 8px; border: 1px solid #ccc; border-radius: 12px; }
        button.add-btn { background: #00897b; color: white; border: none; padding: 0 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .filters { display: flex; justify-content: center; gap: 8px; }
        .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid #00897b; background: transparent; color: #00897b; cursor: pointer; }
        .filter-btn.active { background: #00897b; color: white; }
        .todo-list { display: flex; flex-direction: column; gap: 8px; }
        .todo-card { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid #eee; border-radius: 12px; background: #fafafa; }
        .todo-card.done span { text-decoration: line-through; color: #9e9e9e; }
        .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; color: white; font-weight: bold; }
        .badge.urgent { background: #ef5350; }
        .badge.important { background: #ffa726; }
        .badge.normal { background: #42a5f5; }
        .del-btn { background: none; border: none; color: #ef5350; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">
            <h1>✅ مهامي</h1>
            <button onclick="clearCompleted()" style="background:none;border:none;color:#ef5350;cursor:pointer;">مسح المكتملة</button>
        </div>
        <div class="content">
            <div class="stats">
                <div><div style="font-size:12px;color:#555">الجميع</div><div class="stat-val" id="st-total">2</div></div>
                <div><div style="font-size:12px;color:#555">المتبقية</div><div class="stat-val" id="st-active" style="color:#f57c00">1</div></div>
                <div><div style="font-size:12px;color:#555">المكتملة</div><div class="stat-val" id="st-completed" style="color:#388e3c">1</div></div>
            </div>
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
                <select id="prioritySelect">
                    <option value="عادي">عادي</option>
                    <option value="مهم">مهم</option>
                    <option value="عاجل">عاجل</option>
                </select>
                <button class="add-btn" onclick="addTask()">إضافة</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
                <button class="filter-btn" onclick="setFilter('active', this)">المتبقية</button>
                <button class="filter-btn" onclick="setFilter('completed', this)">المكتملة</button>
            </div>
            <div class="todo-list" id="todoList">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </div>
    <script>
        let todos = [
            { id: 1, title: "مراجعة المشروع", priority: "عاجل", completed: false },
            { id: 2, title: "شراء الحاجيات", priority: "عادي", completed: true }
        ];
        let currentFilter = 'all';

        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            let filtered = todos;
            if (currentFilter === 'active') filtered = todos.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = todos.filter(t => t.completed);

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:40px;color:#9e9e9e;">لا توجد مهام حالياً</div>';
            } else {
                filtered.forEach(t => {
                    let pClass = 'normal';
                    if (t.priority === 'عاجل') pClass = 'urgent';
                    else if (t.priority === 'مهم') pClass = 'important';
                    
                    const div = document.createElement('div');
                    div.className = 'todo-card ' + (t.completed ? 'done' : '');
                    div.innerHTML = `
                        <div style="display:flex;align-items:center;gap:10px;flex:1;">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTodo(${t.id})">
                            <span>${t.title}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="badge ${pClass}">${t.priority}</span>
                            <button class="del-btn" onclick="deleteTodo(${t.id})">🗑️</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
            document.getElementById('st-total').innerText = todos.length;
            document.getElementById('st-active').innerText = todos.filter(t => !t.completed).length;
            document.getElementById('st-completed').innerText = todos.filter(t => t.completed).length;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const priority = document.getElementById('prioritySelect').value;
            if (!input.value.trim()) return;
            todos.unshift({ id: Date.now(), title: input.value.trim(), priority: priority, completed: false });
            input.value = '';
            render();
        }

        function toggleTodo(id) {
            const t = todos.find(x => x.id === id);
            if (t) t.completed = !t.completed;
            render();
        }

        function deleteTodo(id) {
            todos = todos.filter(x => x.id !== id);
            render();
        }

        function clearCompleted() {
            todos = todos.filter(x => !x.completed);
            render();
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        render();
    </script>
</body>
</html>
