<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة بسيطة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            overflow: hidden;
            position: relative;
            padding: 1.5rem;
        }

        /* دوائر جمالية في الخلفية */
        .bg-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .glow-1 {
            background: #6366f1;
            top: 10%;
            right: 15%;
        }

        .glow-2 {
            background: #ec4899;
            bottom: 10%;
            left: 15%;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
            100% { transform: scale(1.2) translate(20px, -20px); opacity: 0.4; }
        }

        /* البطاقة الرئيسية */
        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* الشارة */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 50px;
            color: #a5b4fc;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
            box-shadow: 0 0 10px #6366f1;
        }

        /* العنوان */
        .title {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* الوصف */
        .description {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* الزر */
        .btn-action {
            position: relative;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
            color: white;
            border: none;
            outline: none;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 1.1rem 2.8rem;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 280px;
        }

        .btn-action:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 36px rgba(99, 102, 241, 0.45);
        }

        .btn-action:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .icon {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .btn-action:hover .icon {
            transform: rotate(15deg) scale(1.2);
        }

        /* عدّاد النقرات */
        .counter-box {
            margin-top: 1.75rem;
            font-size: 0.95rem;
            color: #64748b;
            transition: color 0.3s ease;
        }

        .counter-num {
            color: #a5b4fc;
            font-weight: 700;
        }

        /* تنبيه لطيف (Toast) */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 0.85rem 1.75rem;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* دعم الهواتف */
        @media (max-width: 480px) {
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 22px;
            }

            .title {
                font-size: 2rem;
            }

            .description {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .btn-action {
                width: 100%;
                padding: 1rem 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- مؤثرات الإضاءة -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- البطاقة المركزية -->
    <main class="card">
        <div class="badge">
            <span class="badge-dot"></span>
            <span>تصميم عصري</span>
        </div>

        <h1 class="title">أهلاً بك معنا</h1>
        
        <p class="description">
            هذه صفحة بسيطة وأنيقة تم بناؤها باستخدام تقنيات الويب الحديثة.
        </p>

        <button class="btn-action" id="actionBtn">
            <span>اضغط هنا</span>
            <span class="icon">✨</span>
        </button>

        <div class="counter-box">
            تم الضغط: <span class="counter-num" id="clickCount">0</span> مرات
        </div>
    </main>

    <!-- إشعار عند الضغط -->
    <div class="toast" id="toast">
        <span>🎉</span>
        <span>شكراً لضغطك على الزر!</span>
    </div>

    <script>
        const btn = document.getElementById('actionBtn');
        const counterNum = document.getElementById('clickCount');
        const toast = document.getElementById('toast');
        let count = 0;
        let toastTimeout;

        btn.addEventListener('click', () => {
            // زيادة العداد
            count++;
            counterNum.textContent = count;

            // إظهار الإشعار
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);

            // تأثير نبضة خفيفة للزر
            btn.style.transform = 'scale(0.96)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 150);
        });
    </script>
</body>
</html>
