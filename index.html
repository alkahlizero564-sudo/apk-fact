<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آلة حاسبة</title>
    <style>
        :root {
            --bg-color: #000000;
            --display-bg: #000000;
            --btn-gray: #333333;
            --btn-light-gray: #a5a5a5;
            --btn-orange: #ff9f0a;
            --text-white: #ffffff;
            --text-black: #000000;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }

        #calculator {
            width: 100%;
            padding: 20px;
            padding-bottom: 40px;
        }

        #display-container {
            padding: 20px;
            text-align: left; /* Calculations usually flow LTR even in RTL contexts for math */
            direction: ltr;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 150px;
        }

        #prev-calc {
            font-size: 1.5rem;
            color: #888;
            min-height: 1.5rem;
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        #current-calc {
            font-size: 5rem;
            font-weight: 300;
            margin: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        #current-calc::-webkit-scrollbar {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 50%;
            height: 80px;
            width: 80px;
            font-size: 2rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.1s;
        }

        button:active {
            filter: brightness(1.5);
        }

        .btn-number {
            background-color: var(--btn-gray);
            color: var(--text-white);
        }

        .btn-function {
            background-color: var(--btn-light-gray);
            color: var(--text-black);
        }

        .btn-operator {
            background-color: var(--btn-orange);
            color: var(--text-white);
            font-size: 2.5rem;
        }

        .btn-zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 40px;
            justify-content: flex-start;
            padding-left: 30px;
        }

        @media (max-width: 400px) {
            button {
                height: 70px;
                width: 70px;
                font-size: 1.7rem;
            }
            #current-calc {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <div id="display-container">
        <div id="prev-calc"></div>
        <div id="current-calc">0</div>
    </div>

    <div id="calculator">
        <div class="buttons-grid">
            <button class="btn-function" onclick="clearDisplay()">AC</button>
            <button class="btn-function" onclick="toggleSign()">+/-</button>
            <button class="btn-function" onclick="appendOperator('%')">%</button>
            <button class="btn-operator" onclick="appendOperator('/')">÷</button>

            <button class="btn-number" onclick="appendNumber('7')">7</button>
            <button class="btn-number" onclick="appendNumber('8')">8</button>
            <button class="btn-number" onclick="appendNumber('9')">9</button>
            <button class="btn-operator" onclick="appendOperator('*')">×</button>

            <button class="btn-number" onclick="appendNumber('4')">4</button>
            <button class="btn-number" onclick="appendNumber('5')">5</button>
            <button class="btn-number" onclick="appendNumber('6')">6</button>
            <button class="btn-operator" onclick="appendOperator('-')">-</button>

            <button class="btn-number" onclick="appendNumber('1')">1</button>
            <button class="btn-number" onclick="appendNumber('2')">2</button>
            <button class="btn-number" onclick="appendNumber('3')">3</button>
            <button class="btn-operator" onclick="appendOperator('+')">+</button>

            <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
            <button class="btn-number" onclick="appendNumber('.')">.</button>
            <button class="btn-operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetScreen = false;

        const currentDisplay = document.getElementById('current-calc');
        const prevDisplay = document.getElementById('prev-calc');

        function updateDisplay() {
            currentDisplay.innerText = currentInput;
            // Auto-scale font size if number gets too long
            if (currentInput.length > 6) {
                currentDisplay.style.fontSize = '3rem';
            } else if (currentInput.length > 9) {
                currentDisplay.style.fontSize = '2rem';
            } else {
                currentDisplay.style.fontSize = '5rem';
            }
        }

        function appendNumber(number) {
            if (currentInput === '0' || shouldResetScreen) {
                currentInput = number;
                shouldResetScreen = false;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            prevDisplay.innerText = '';
            updateDisplay();
        }

        function toggleSign() {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function appendOperator(op) {
            if (operator !== null) calculate();
            previousInput = currentInput;
            operator = op;
            prevDisplay.innerText = `${previousInput} ${operator === '*' ? '×' : operator === '/' ? '÷' : operator}`;
            shouldResetScreen = true;
        }

        function calculate() {
            if (operator === null || shouldResetScreen) return;
            
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    result = prev / current;
                    break;
                case '%':
                    result = prev % current;
                    break;
                default:
                    return;
            }

            currentInput = formatResult(result);
            operator = null;
            prevDisplay.innerText = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        function formatResult(num) {
            const stringNum = num.toString();
            if (stringNum.length > 12) {
                return num.toPrecision(8);
            }
            return stringNum;
        }

        // Touch feedback shim
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.style.filter = 'brightness(1.5)';
            });
            btn.addEventListener('touchend', () => {
                btn.style.filter = 'brightness(1.0)';
            });
        });
    </script>
</body>
</html>
