name: generate-pair

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Project name (the apps become <base>-customer and <base>-admin)"
        required: true
      lang:
        description: "html | react | flutter | python"
        required: true
        default: "flutter"
      admins:
        description: "Admin emails, comma separated"
        required: true
      push:
        description: "true to send push notifications (Firebase)"
        required: true
        default: "true"
      description:
        description: "What the business is and what the apps do"
        required: true
      names:
        description: "Names under the icons: customer name|admin name (can be Arabic)"
        required: false
        default: ""
      supabase_ref:
        description: "A client's Supabase project (its token is the secret SUPABASE_TOKEN_<REF>); empty = the default project"
        required: false
        default: ""

permissions:
  contents: write

concurrency: generate-pair

jobs:
  pair:
    runs-on: ubuntu-latest
    # Two full apps, each with its completion and design passes: on a day Gemini is overloaded (503s, stalls) one app
    # took 33 minutes, so 60 cut the second app off and nothing was saved.
    timeout-minutes: 120
    env:
      # The project picked for this pair in APK Fact (a client's own, or one APK Fact created), else the default.
      SUPABASE_ACCESS_TOKEN: ${{ inputs.supabase_ref != '' && secrets[format('SUPABASE_TOKEN_{0}', inputs.supabase_ref)] || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.supabase_ref != '' && inputs.supabase_ref || vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_ref == '' && secrets.SUPABASE_PUBLISHABLE_KEY || '' }}
      SUPABASE_SMTP: ${{ secrets.SUPABASE_SMTP }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AI_PROVIDER: gemini
      # A model that sends nothing for 3 minutes is stuck; move to the next one instead of waiting 5.
      GEMINI_STALL_SECONDS: "180"
      BASE: ${{ inputs.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser for the HTML runtime check and the preview quality gate
        run: |
          npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2 > /dev/null || echo "playwright-core not installed: only the syntax check will run"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          pip install google-auth requests
          if [ "${{ inputs.lang }}" = "python" ]; then
            pip install "flet==$(cd scripts && python -c 'from native_langs import FLET_VERSION; print(FLET_VERSION)')"
          fi
      - if: inputs.lang == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Push and the phone / password sign-in both deploy an Edge Function.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: "Supabase: tables and roles"
        env:
          ADMINS: ${{ inputs.admins }}
          DESCRIPTION: ${{ inputs.description }}
          LANG_CHOICE: ${{ inputs.lang }}
          PUSH: ${{ inputs.push }}
        run: |
          printf '%s' "$DESCRIPTION" > "$RUNNER_TEMP/description.txt"
          python scripts/pair.py backend --base "$BASE" --lang "$LANG_CHOICE" --admins "$ADMINS" --push "$PUSH" --description-file "$RUNNER_TEMP/description.txt"
      - name: "Supabase: sign-in (and its self-test)"
        run: python scripts/pair.py auth --base "$BASE"
      - name: "Firebase: notifications"
        run: python scripts/pair.py firebase --base "$BASE"
      - name: Generate customer app
        run: python scripts/pair.py generate --base "$BASE" --role customer
      - name: Generate admin app
        run: python scripts/pair.py generate --base "$BASE" --role admin

      - name: Save
        env:
          NAMES: ${{ inputs.names }}
        run: |
          C="${NAMES%%|*}"; A="${NAMES#*|}"
          if [ -n "$C" ]; then python scripts/app_label.py set "$BASE-customer" "$C"; fi
          if [ -n "$A" ] && [ "$A" != "$NAMES" ]; then python scripts/app_label.py set "$BASE-admin" "$A"; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps fixes
          git commit -m "Generate connected apps: $BASE" || echo "nothing to commit"
          # main may have moved while we generated (merged PRs, or a duplicate run of this same pair). Sync with a
          # merge that keeps THIS run's freshly generated files on any conflict (-X ours), and retry the push a few
          # times for the normal race where someone pushes between our fetch and push.
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || { git merge --abort || true; }
            if git push origin HEAD:main; then echo "saved on attempt $i"; pushed=1; break; fi
            sleep $((i * 3))
          done
          if [ "$pushed" != 1 ]; then echo "::error::could not push the generated apps to main after retries"; exit 1; fi
