name: Build App APK
run-name: Build ${{ github.event.inputs.app }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App folder name inside apps/"
        required: true
      notes:
        description: "What changed (shown in the installed app's update message)"
        required: false
        default: ""
      store:
        description: "true: also build the Google Play file (.aab), signed with the app's permanent key"
        required: false
        default: "false"

permissions:
  contents: write

# The public updates repo (APK Fact > الإعدادات > الخصوصية): APKs and version.json for installed apps.
env:
  UPDATES_REPO: ${{ vars.UPDATES_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: ${{ github.event.inputs.app }}
      MAX_ATTEMPTS: "3"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Browser for the HTML runtime check
        run: |
          npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2 > /dev/null || echo "playwright-core not installed: only the syntax check will run"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Pick the version number
        env:
          APP: ${{ github.event.inputs.app }}
        run: |
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          V=$(python scripts/updater.py next "$APP")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "This build is version $V (1.0.$V)"

      - name: Wrap HTML as Android app and build (AI fixes errors and retries)
        run: |
          set -e
          if ! [[ "$APP" =~ ^[a-z0-9-]+$ ]]; then echo "bad app name"; exit 1; fi
          test -f "apps/$APP/index.html"
          PKG=$(echo "$APP" | tr -cd 'a-z0-9')
          SRC="$GITHUB_WORKSPACE/apps/$APP"

          # Apps of a connected pair: every piece of the connection in the code before building (scripts/pair_wiring.py).
          if [ -f "$SRC/pair.json" ]; then python "$GITHUB_WORKSPACE/scripts/pair_wiring.py" fix "$APP" || true; fi
          # JavaScript errors don't fail the APK build but leave the app broken: fix them first.
          for k in 1 2; do
            if node "$GITHUB_WORKSPACE/scripts/check_html.js" "$SRC/index.html" > /tmp/check.log; then
              cat /tmp/check.log
              break
            fi
            cat /tmp/check.log
            echo "=== JavaScript errors found. Asking AI to fix index.html ==="
            python "$GITHUB_WORKSPACE/scripts/fix_html.py" "$SRC/index.html" /tmp/check.log || echo "AI fix failed, continuing"
          done

          mkdir /tmp/wrap
          cd /tmp/wrap
          npm init -y > /dev/null
          # Capacitor 8: Android SDK 36, which Google Play requires for new apps and updates.
          npm i @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@3
          mkdir www
          cp -r "$SRC"/. www/
          rm -f www/icon.png
          APP_ID=$(python "$GITHUB_WORKSPACE/scripts/app_id.py" get "$APP" html)
          echo "Package name: $APP_ID"
          npx cap init "$APP" "$APP_ID" --web-dir www
          npx cap add android
          # The name under the icon (can be Arabic), from apps/<app>/display-name.txt.
          python "$GITHUB_WORKSPACE/scripts/app_label.py" android android/app/src/main/res "$APP"
          # Android permissions: the ones chosen in APK Fact (perms.txt) and the ones the code uses.
          python "$GITHUB_WORKSPACE/scripts/perms.py" manifest "$APP" android/app/src/main/AndroidManifest.xml

          # Connected apps with push: Capacitor applies Firebase by itself when google-services.json is there.
          if [ -f "$SRC/google-services.json" ]; then
            echo "Push notifications: adding @capacitor/push-notifications and google-services.json"
            npm i @capacitor/push-notifications@8
            cp "$SRC/google-services.json" android/app/google-services.json
          fi

          if [ -f "$SRC/icon.png" ]; then
            echo "Custom icon found, applying it"
            mkdir -p assets
            node -e "require('sharp')(process.argv[1]).resize(1024,1024,{fit:'cover'}).png().toFile('assets/icon.png').then(()=>console.log('icon ready')).catch(e=>{console.error(e);process.exit(1)})" "$SRC/icon.png" || echo "icon resize failed, using default icon"
            if [ -f assets/icon.png ]; then
              npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' || echo "icon generate failed, using default icon"
            fi
          else
            echo "No custom icon, using default"
          fi

          chmod +x android/gradlew
          # A release build (not a debug one); signed with the app's permanent key from the vault after the build.
          sed -i "s/minifyEnabled false/minifyEnabled false\n            signingConfig signingConfigs.debug/" android/app/build.gradle
          grep -n "signingConfig" android/app/build.gradle
          # Each build gets a higher version so Android accepts it as an update.
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION/; s/versionName \"[^\"]*\"/versionName \"1.0.$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

          OK=0
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Build attempt $i of $MAX_ATTEMPTS ==="
            rm -rf www
            mkdir www
            cp -r "$SRC"/. www/
            rm -f www/icon.png www/google-services.json www/meta.json www/pair.json
            rm -f www/version.json www/contract.txt www/display-name.txt www/design.html
            python "$GITHUB_WORKSPACE/scripts/updater.py" inject html www "$APP" "$VERSION"
            set +e
            (npx cap sync android && cd android && ./gradlew assembleRelease --no-daemon) 2>&1 | tee /tmp/build.log
            STATUS=${PIPESTATUS[0]}
            set -e
            if [ "$STATUS" -eq 0 ]; then
              OK=1
              break
            fi
            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              break
            fi
            echo "=== Build failed. Asking AI to check index.html ==="
            set +e
            python "$GITHUB_WORKSPACE/scripts/fix_html.py" "$SRC/index.html" /tmp/build.log
            FIX=$?
            set -e
            if [ "$FIX" -eq 3 ]; then
              echo "Not caused by index.html, retrying once more without changes"
            elif [ "$FIX" -ne 0 ]; then
              echo "AI could not fix this build (code $FIX)"
              break
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APP.apk"

          if [ "${{ github.event.inputs.store }}" = "true" ]; then
            echo "=== Google Play file (.aab) ==="
            (cd android && ./gradlew bundleRelease --no-daemon)
            cp android/app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/$APP.aab"
          fi

      - name: Save fixed code
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "apps/$APP/index.html"
          git commit -m "Auto-fix build errors: $APP" || echo "no code changes"
          # GitHub sometimes answers a push with a temporary error (500): retry instead of losing the fixed code.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Sign with the app's permanent key (private vault)
        env:
          APP: ${{ github.event.inputs.app }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
        run: |
          # The Google Play file (.aab) is signed with the same permanent key; it needs the vault.
          AAB=(); if [ -f "$APP.aab" ]; then AAB=(--aab "$APP.aab"); fi
          python scripts/vault.py --app "$APP" --apk "$APP.apk" "${AAB[@]}" --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          python scripts/updates_repo.py release "app-$APP-${{ github.run_number }}" "$APP #${{ github.run_number }}" "APK for $APP" "$APP.apk" $( [ -f "$APP.aab" ] && echo "$APP.aab" )

      - name: Tell installed copies an update is ready
        env:
          APP: ${{ github.event.inputs.app }}
          TAG: app-${{ github.event.inputs.app }}-${{ github.run_number }}
          UPDATE_NOTES: ${{ inputs.notes }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          if [ -z "$VAULT_TOKEN" ] || [ -z "$VAULT_REPO" ]; then
            echo "::warning::No private vault: this APK is not signed with a permanent key, so it cannot update installed copies. Set up the vault in APK Fact > الإعدادات."
            exit 0
          fi
          python scripts/updater.py publish "$APP" "$VERSION" "$(python scripts/updates_repo.py base "$TAG")/$APP.apk"
          git add "apps/$APP/version.json"
          if git commit -m "Version $VERSION: $APP"; then
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              [ "$i" -eq 5 ] && exit 1
              sleep $((i * 5))
            done
          fi
          # Installed copies read version.json from the public updates repo when apk-fact is private.
          python scripts/updates_repo.py mirror "$APP"
