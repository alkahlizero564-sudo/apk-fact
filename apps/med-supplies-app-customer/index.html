    // Auth Helper Functions
    async function ensureSession() {
      let token = localStorage.getItem('med_supplies_token');
      let userId = localStorage.getItem('med_supplies_user_id');
      let refreshToken = localStorage.getItem('med_supplies_refresh_token');

      if (token && userId) return { token, userId, refreshToken };

      try {
        const res = await fetch(`${API_URL}/auth/v1/signup`, {
          method: 'POST',
          headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (data.access_token && data.user) {
          localStorage.setItem('med_supplies_token', data.access_token);
          localStorage.setItem('med_supplies_refresh_token', data.refresh_token || '');
          localStorage.setItem('med_supplies_user_id', data.user.id);
          return { token: data.access_token, userId: data.user.id, refreshToken: data.refresh_token };
        }
      } catch (e) {
        console.error("Session initialization failed:", e);
      }
      return null;
    }

    async function authFetch(endpoint, options = {}) {
      let token = localStorage.getItem('med_supplies_token');
      const headers = {
        'apikey': ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation',
        ...(options.headers || {})
      };
      if (token && !token.startsWith('sb_publishable_')) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      let response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
      
      if (response.status === 401) {
        const rt = localStorage.getItem('med_supplies_refresh_token');
        if (rt) {
          try {
            const rfRes = await fetch(`${API_URL}/auth/v1/token?grant_type=refresh_token`, {
              method: 'POST',
              headers: { 'apikey': ANON_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ refresh_token: rt })
            });
            const rfData = await rfRes.json();
            if (rfData.access_token) {
              localStorage.setItem('med_supplies_token', rfData.access_token);
              localStorage.setItem('med_supplies_refresh_token', rfData.refresh_token || rt);
              headers['Authorization'] = `Bearer ${rfData.access_token}`;
              response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
            } else {
              const sess = await ensureSession();
              if (sess) {
                headers['Authorization'] = `Bearer ${sess.token}`;
                response = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
              }
            }
          } catch(err) {
            console.error("Refresh error", err);
          }
        }
      }
      return response;
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [userId, setUserId] = useState(localStorage.getItem('med_supplies_user_id') || null);
      const [activeTab, setActiveTab] = useState('home'); // home, catalog, orders, notifications, profile
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState(null);

      // Data States
      const [categories, setCategories] = useState(DEMO_CATEGORIES);
      const [products, setProducts] = useState(DEMO_PRODUCTS);
      const [banners, setBanners] = useState(DEMO_BANNERS);
      const [cartItems, setCartItems] = useState([]);
      const [orders, setOrders] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [addresses, setAddresses] = useState([]);
      const [userProfile, setUserProfile] = useState({ full_name: '', phone: '', email: '' });

      // UI Control States
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [isAddressModalOpen, setIsAddressModalOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      // Toast feedback helper
      const showToast = (msg, type = 'success') => {
        setToastMsg({ msg, type });
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Initial Auth & Session Setup
      useEffect(() => {
        async function init() {
          const sess = await ensureSession();
          if (sess) {
            setUserId(sess.userId);
            fetchInitialData(sess.userId);
          }
        }
        init();
      }, []);

      // Polling Sync every 15s & Focus change
      useEffect(() => {
        if (!userId) return;
        const interval = setInterval(() => {
          fetchLiveData(userId, false);
        }, 15000);

        const handleFocus = () => fetchLiveData(userId, false);
        window.addEventListener('focus', handleFocus);

        return () => {
          clearInterval(interval);
          window.removeEventListener('focus', handleFocus);
        };
      }, [userId, activeTab]);

      const fetchInitialData = async (uid) => {
        setIsLoading(true);
        await fetchLiveData(uid, true);
        setIsLoading(false);
      };

      const fetchLiveData = async (uid, isFirstLoad = false) => {
        const idToUse = uid || userId;
        if (!idToUse) return;

        try {
          // Fetch Categories
          const catRes = await authFetch('/rest/v1/med_supplies_app_categories?select=*&order=created_at.desc');
          if (catRes.ok) {
            const data = await catRes.json();
            if (data && data.length > 0) setCategories(data);
          }

          // Fetch Products
          const prodRes = await authFetch('/rest/v1/med_supplies_app_products?select=*&order=created_at.desc');
          if (prodRes.ok) {
            const data = await prodRes.json();
            if (data && data.length > 0) setProducts(data);
          }

          // Fetch Banners
          const banRes = await authFetch('/rest/v1/med_supplies_app_banners?select=*&is_active=eq.true');
          if (banRes.ok) {
            const data = await banRes.json();
            if (data && data.length > 0) setBanners(data);
          }

          // Fetch Notifications
          const notifRes = await authFetch(`/rest/v1/med_supplies_app_notifications?or=(to_user.eq.${idToUse},to_role.eq.customer)&order=created_at.desc`);
          if (notifRes.ok) {
            const data = await notifRes.json();
            setNotifications(data || []);
          }

          // Fetch Orders
          const orderRes = await authFetch(`/rest/v1/med_supplies_app_orders?customer_id=eq.${idToUse}&order=created_at.desc`);
          if (orderRes.ok) {
            const data = await orderRes.json();
            setOrders(data || []);
          }

          // Fetch Cart Items
          const cartRes = await authFetch(`/rest/v1/med_supplies_app_cart_items?customer_id=eq.${idToUse}`);
          if (cartRes.ok) {
            const data = await cartRes.json();
            setCartItems(data || []);
          }

          // Fetch Addresses
          const addrRes = await authFetch(`/rest/v1/med_supplies_app_addresses?customer_id=eq.${idToUse}`);
          if (addrRes.ok) {
            const data = await addrRes.json();
            setAddresses(data || []);
          }

          // Fetch Profile
          const profRes = await authFetch(`/rest/v1/med_supplies_app_profiles?id=eq.${idToUse}`);
          if (profRes.ok) {
            const data = await profRes.json();
            if (data && data.length > 0) {
              setUserProfile(data[0]);
            }
          }
        } catch (err) {
          console.error("Error refreshing live data:", err);
        }
      };

      // Cart Calculations
      const cartFullDetails = useMemo(() => {
        return cartItems.map(ci => {
          const prod = products.find(p => p.id === ci.product_id) || {
            name: "منتج طبي",
            price: 0,
            image_url: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=400&q=80"
          };
          return {
            ...ci,
            product: prod,
            itemTotal: (prod.price || 0) * ci.quantity
          };
        });
      }, [cartItems, products]);

      const cartSubtotal = useMemo(() => {
        return cartFullDetails.reduce((sum, item) => sum + item.itemTotal, 0);
      }, [cartFullDetails]);

      const deliveryFee = cartSubtotal > 0 ? (cartSubtotal > 1000 ? 0 : 35) : 0;
      const cartTotal = cartSubtotal + deliveryFee;

      // Cart Actions
      const addToCart = async (product, qty = 1) => {
        if (!userId) return;

        const existing = cartItems.find(item => item.product_id === product.id);
        if (existing) {
          const newQty = existing.quantity + qty;
          const patchRes = await authFetch(`/rest/v1/med_supplies_app_cart_items?id=eq.${existing.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ quantity: newQty })
          });
          if (patchRes.ok) {
            showToast(`تم تحديث كمية (${product.name}) بالسلة`);
            fetchLiveData(userId);
          }
        } else {
          const postRes = await authFetch(`/rest/v1/med_supplies_app_cart_items`, {
            method: 'POST',
            body: JSON.stringify({
              customer_id: userId,
              product_id: product.id,
              quantity: qty
            })
          });
          if (postRes.ok) {
            showToast(`تمت إضافة (${product.name}) إلى السلة`);
            fetchLiveData(userId);
          } else {
            // Local state fallback if table RLS or network issue
            setCartItems(prev => [...prev, { id: Date.now(), customer_id: userId, product_id: product.id, quantity: qty }]);
            showToast(`تمت الإضافة للسلة`);
          }
        }
      };

      const updateCartQuantity = async (cartItemId, newQty) => {
        if (newQty <= 0) {
          await removeFromCart(cartItemId);
          return;
        }
        setCartItems(prev => prev.map(item => item.id === cartItemId ? { ...item, quantity: newQty } : item));
        await authFetch(`/rest/v1/med_supplies_app_cart_items?id=eq.${cartItemId}`, {
          method: 'PATCH',
          body: JSON.stringify({ quantity: newQty })
        });
      };

      const removeFromCart = async (cartItemId) => {
        setCartItems(prev => prev.filter(item => item.id !== cartItemId));
        await authFetch(`/rest/v1/med_supplies_app_cart_items?id=eq.${cartItemId}`, {
          method: 'DELETE'
        });
        showToast("تم إزالة المنتج من السلة", "info");
      };

      const clearCart = async () => {
        setCartItems([]);
        if (userId) {
          await authFetch(`/rest/v1/med_supplies_app_cart_items?customer_id=eq.${userId}`, {
            method: 'DELETE'
          });
        }
      };

      // Order Placement Logic
      const handlePlaceOrder = async ({ addressText, addressId, paymentMethod, notes, phoneNameInfo }) => {
        if (!userId || cartItems.length === 0) return;

        setIsLoading(true);
        try {
          // Update profile if phone/name given
          if (phoneNameInfo?.name || phoneNameInfo?.phone) {
            await authFetch(`/rest/v1/med_supplies_app_profiles?id=eq.${userId}`, {
              method: 'PATCH',
              body: JSON.stringify({
                full_name: phoneNameInfo.name || userProfile.full_name,
                phone: phoneNameInfo.phone || userProfile.phone
              })
            });
          }

          // Insert Order
          const orderPayload = {
            customer_id: userId,
            address_id: addressId || null,
            delivery_address_text: addressText,
            status: "قيد الانتظار",
            payment_method: paymentMethod,
            payment_status: paymentMethod === "بطاقة ائتمانية" ? "مدفوع" : "غير مدفوع",
            subtotal: cartSubtotal,
            delivery_fee: deliveryFee,
            total_amount: cartTotal,
            notes: notes || ""
          };

          const orderRes = await authFetch(`/rest/v1/med_supplies_app_orders`, {
            method: 'POST',
            body: JSON.stringify(orderPayload)
          });

          let newOrder = null;
          if (orderRes.ok) {
            const createdData = await orderRes.json();
            newOrder = Array.isArray(createdData) ? createdData[0] : createdData;
          }

          const orderIdToUse = newOrder?.id || Date.now();

          // Insert Order Line Items
          const orderItemsPayloads = cartFullDetails.map(ci => ({
            customer_id: userId,
            order_id: orderIdToUse,
            product_id: ci.product_id,
            product_name: ci.product.name,
            unit_price: ci.product.price,
            quantity: ci.quantity,
            total_price: ci.itemTotal
          }));

          for (const itemPayload of orderItemsPayloads) {
            await authFetch(`/rest/v1/med_supplies_app_order_items`, {
              method: 'POST',
              body: JSON.stringify(itemPayload)
            });
          }

          // Send Notification to Admin
          await authFetch(`/rest/v1/med_supplies_app_notifications`, {
            method: 'POST',
            body: JSON.stringify({
              to_role: "admin",
              title: "طلب جديد وارد",
              body: `تم استلام طلب جديد رقم #${orderIdToUse} بمبلغ ${cartTotal.toFixed(2)} ر.س`,
              data: { order_id: orderIdToUse }
            })
          });

          // Empty Cart
          await clearCart();

          showToast("تم إرسال طلبك بنجاح! يسعدنا خدمتك.", "success");
          setIsCheckoutOpen(false);
          setIsCartOpen(false);
          setActiveTab('orders');
          fetchLiveData(userId);
        } catch (err) {
          console.error("Order creation error:", err);
          showToast("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً", "error");
        } finally {
          setIsLoading(false);
        }
      };

      // Add New Address
      const handleAddAddress = async (newAddr) => {
        if (!userId) return;
        const payload = {
          customer_id: userId,
          title: newAddr.title,
          address_line: newAddr.address_line,
          city: newAddr.city,
          phone: newAddr.phone,
          is_default: addresses.length === 0
        };
        const res = await authFetch(`/rest/v1/med_supplies_app_addresses`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        e.preventDefault();

          ? `${selectedObj.city} - ${selectedObj.address_line} (${selectedObj.phone})`
          : (customAddressText || "موقع التوصيل المحدد");

        if (!addressText.trim()) {
          alert("يرجى اختيار أو كتابة عنوان التوصيل");
          return;

        onSubmitOrder({
          addressText,
          addressId: selectedAddressId,
          paymentMethod,
          notes,
          phoneNameInfo: { name: custName, phone: custPhone }

      };

      return (

                {addresses.length > 0 ? (

                      <label

                <div className="flex justify-between text-slate-600">
                  <span>المجموع:</span>
                  <span className="font-bold">{cartSubtotal.toFixed(2)} ر.س</span>
                </div>
                <div className="flex justify-between text-slate-600">
                  <span>التوصيل:</span>
                  <span className="font-bold">{deliveryFee === 0 ? "مجاني" : `${deliveryFee.toFixed(2)} ر.س`}</span>
                </div>
                <div className="flex justify-between text-brand-900 font-extrabold text-sm pt-1 border-t border-brand-200">
                  <span>المبلغ المطلوب سداده:</span>
                  <span className="text-brand-700">{cartTotal.toFixed(2)} ر.س</span>
                </div>
              </div>

              <button 
                type="submit"
                disabled={isLoading}
                className="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold text-sm shadow-md active:scale-98 transition flex items-center justify-center gap-2 disabled:opacity-50"

    // Order Card & Status Tracker Component
    function OrderCard({ order }) {
      const getStatusBadge = (status) => {
        switch (status) {
          case 'قيد الانتظار':
            return { color: 'bg-amber-100 text-amber-800 border-amber-300', icon: '⏳', step: 1 };
          case 'قيد التوصيل':
            return { color: 'bg-blue-100 text-blue-800 border-blue-300', icon: '🚚', step: 2 };
          case 'مكتمل':
            return { color: 'bg-emerald-100 text-emerald-800 border-emerald-300', icon: '✅', step: 3 };
          default:
            return { color: 'bg-slate-100 text-slate-800 border-slate-300', icon: '📦', step: 1 };
        }
      };

      const badge = getStatusBadge(order.status);

      return (
        <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="font-extrabold text-slate-900 text-sm">طلب #{order.id}</span>
              <span className="text-[10px] text-slate-400">
                {new Date(order.created_at || Date.now()).toLocaleDateString('ar-SA')}
              </span>
            </div>
            <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold border flex items-center gap-1 ${badge.color}`}>
              <span>{badge.icon}</span>
              <span>{order.status}</span>
            </span>
          </div>

          {/* Visual Step Tracker Timeline */}
          <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
            <div className="flex items-center justify-between text-[11px] font-bold text-slate-600 mb-2">
              <span className={badge.step >= 1 ? 'text-brand-600' : 'text-slate-400'}>1. تم الاستلام</span>
              <span className={badge.step >= 2 ? 'text-brand-600' : 'text-slate-400'}>2. قيد التوصيل</span>
              <span className={badge.step >= 3 ? 'text-emerald-600' : 'text-slate-400'}>3. تم التسليم</span>
            </div>
            <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden flex">
              <div className={`h-full transition-all duration-500 ${
                badge.step === 1 ? 'w-1/3 bg-amber-500' :
                badge.step === 2 ? 'w-2/3 bg-blue-500' : 'w-full bg-emerald-500'
              }`}></div>
            </div>
          </div>

          <div className="text-xs text-slate-600 space-y-1">
            <p><span className="font-semibold text-slate-800">عنوان الشحن:</span> {order.delivery_address_text}</p>
            <p><span className="font-semibold text-slate-800">طريقة الدفع:</span> {order.payment_method} ({order.payment_status})</p>
            {order.notes && <p className="text-amber-700 font-medium">ملاحظة: {order.notes}</p>}
          </div>

          <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs font-bold">
            <span className="text-slate-600">المبلغ الإجمالي:</span>
            <span className="text-brand-700 text-sm font-extrabold">{Number(order.total_amount).toFixed(2)} ر.س</span>
          </div>
        </div>
      );
    }

    // --- MOUNT APP ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
