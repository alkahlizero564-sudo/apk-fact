name: Generate App
on:
  push:
    # Only requests on main: other branches merge main's request files and must not regenerate apps.
    branches: [main]
    paths: ["request.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser for the HTML runtime check
        run: |
          npm i --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2 > /dev/null || echo "playwright-core not installed: only the syntax check will run"
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Generate
        run: node generate.js
        env:
          AI_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Busy Gemini (503 high demand): keep trying 20 minutes before failing the whole generation.
          GEMINI_PATIENCE_SECONDS: "1200"
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "auto: update app"
          # main may have moved while the AI generated (other runs push builds/versions). Merge it in, keeping THIS
          # run's freshly generated files on a conflict (-X ours), and retry the push for the normal race. Without
          # this, a push rejected as non-fast-forward lost the generated app.
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            if ! git merge -X ours --no-edit origin/main; then
              git merge --abort || true
              echo "::error::Could not save: the app's files changed on main during generation (was the app deleted or renamed?)."
              exit 1
            fi
            if git push origin HEAD:main; then echo "saved on attempt $i"; exit 0; fi
            sleep $((i * 3))
          done
          echo "::error::could not push the generated app to main after retries"
          exit 1
