name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android

permissions:
  contents: write

# The public updates repo (APK Fact > الإعدادات > الخصوصية): APKs and version.json for installed apps.
env:
  UPDATES_REPO: ${{ vars.UPDATES_REPO }}

jobs:
  build:
    name: Build APK locally
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Version number of this build
        # Each build gets its own version (build 82 -> versionCode 82, "1.0.82") so Android sees a real update.
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const n = Number(process.env.RUN);
            a.expo.version = "1.0." + n;
            a.expo.android = { ...a.expo.android, versionCode: n };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2) + "\n");
            console.log("version", a.expo.version, "versionCode", n);
          '
        env:
          RUN: ${{ github.run_number }}

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on this runner (free)
        env:
          CI: "1"
        run: eas build --platform android --profile preview --local --non-interactive --output ./app.apk

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          python3 scripts/updates_repo.py release "apk-${{ github.run_number }}" "APK #${{ github.run_number }}" "Built from ${{ github.sha }}" app.apk
